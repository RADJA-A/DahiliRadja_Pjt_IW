<div class="notifications-dropdown">
  <div class="notifications-header">
    <h3>Notifications</h3>
    <button class="btn-text" (click)="marquerToutesLues()" *ngIf="notifications.length > 0">
      Tout marquer comme lu
    </button>
  </div>

  <div class="notifications-list" *ngIf="!loading">
    <div class="notification-item" 
         *ngFor="let notification of notifications" 
         [class.non-lue]="!notification.lu"
         (click)="marquerCommeLue(notification)">
      <div class="notification-icon">{{ getIcone(notification.type) }}</div>
      <div class="notification-content">
        <h4>{{ notification.titre }}</h4>
        <p>{{ notification.message }}</p>
        <span class="notification-date">{{ notification.dateCreation | date:'short' }}</span>
      </div>
      <button class="btn-delete" (click)="supprimerNotification(notification); $event.stopPropagation()">
        🗑️
      </button>
    </div>

    <div class="no-notifications" *ngIf="notifications.length === 0">
      <p>Aucune notification</p>
    </div>
  </div>

  <div class="loading" *ngIf="loading">
    Chargement...
  </div>
</div>
