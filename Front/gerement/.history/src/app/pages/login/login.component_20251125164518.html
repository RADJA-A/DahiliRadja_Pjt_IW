<div class="center-wrapper">
   <form class="login-container" [formGroup]="loginForm" (ngSubmit)="onSubmit()"> 
    <h2>Login</h2>
     <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <label for="email">Email</label>
    <input 
      type="email" 
      id="email" 
      formControlName="email"
      placeholder="Entrer votre email" 
    />
    <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
      Please enter a valid email
    </div>

    <label for="password">Password</label>
    <input 
      type="password" 
      id="password" 
      formControlName="password"
      placeholder="Enter your password" 
    />
    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
      Le mot de passe doit contenir au moins 6 caracteres
    </div>
    <button type="submit" [disabled]="loginForm.invalid">connecter</button>
  </form>
</div>
